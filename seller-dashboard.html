
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard | AuctionAura</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            background: #fff5f6;
            color: #351b24;
        }

        header {
            background: #8e1738;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: "Playfair Display", serif;
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(142, 23, 56, 0.08);
        }

        .card h3 {
            font-family: "Playfair Display", serif;
            font-size: 24px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5cbd2;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #8e1738;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #b32e53;
        }

        .listing-placeholder {
            text-align: center;
            padding: 35px 10px;
            color: #8b6872;
        }

        @media (max-width: 750px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>AuctionAura ♡</h1>
        <a href="index.html">← Home</a>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Seller Dashboard ✦</h2>
            <p>Add your treasures, manage prices, and create auctions.</p>
        </section>

        <div class="dashboard-grid">

            <section class="card">
                <h3>♡ Add New Product</h3>

                <form id="productForm">

                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="Enter product name" required>

                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Describe your product" required></textarea>

                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Collectibles">Collectibles</option>
                        <option value="Jewellery">Jewellery</option>
                        <option value="K-Pop">K-Pop</option>
                        <option value="Makeup">Makeup</option>
                        <option value="Property">Property</option>
                    </select>

                    <label for="imageUrl">Product Image URL</label>
                    <input type="url" id="imageUrl" placeholder="Paste image URL">

                    <label for="startingPrice">Starting Price (₹)</label>
                    <input type="number" id="startingPrice" min="0" step="0.01" placeholder="Enter starting price" required>

                    <label for="bidIncrement">Bid Increment (₹)</label>
                    <input type="number" id="bidIncrement" min="1" step="0.01" placeholder="Example: 100" required>

                    <label for="startTime">Auction Start</label>
                    <input type="datetime-local" id="startTime" required>

                    <label for="endTime">Auction End</label>
                    <input type="datetime-local" id="endTime" required>

                    <button type="submit" class="submit-btn">
                        Add Product ♡
                    </button>

                </form>
            </section>

            <section class="card">
                <h3>♡ My Products</h3>

                <div id="myProducts">
                    <div class="listing-placeholder">
                        <p>✦ Your listed products will appear here.</p>
                        <p>Add your first product to get started.</p>
                    </div>
                </div>
            </section>

        </div>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="seller-dashboard.js"></script>
</body>
</html>
